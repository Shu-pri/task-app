<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>タスク管理</title>
<link rel="manifest" href="manifest.json" />
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: #ffffff;
    color: #333;
  }

  header {
    background: #4FC3F7;
    color: white;
    padding: 16px;
    font-size: 20px;
    text-align: center;
  }

  .tabs {
    display: flex;
    border-bottom: 2px solid #4FC3F7;
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 12px;
    cursor: pointer;
    font-weight: bold;
  }

  .tab.active {
    background: #E1F5FE;
    color: #0277BD;
  }

  /* フィルタボタン */
  .filters {
    display: flex;
    justify-content: space-around;
    padding: 10px;
    border-bottom: 1px solid #ddd;
    background: #f7f7f7;
  }

  .filter-btn {
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    background: #e0e0e0;
    font-size: 14px;
  }

  .filter-btn.active {
    background: #4FC3F7;
    color: white;
  }

  .task-list {
    padding: 16px;
  }

  .task {
    background: #fff;
    border-left: 4px solid #44C3F7;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .task.completed {
    opacity: 0.5;
    text-decoration: line-through;
  }

  .task-buttons button {
    margin-left: 6px;
    border: none;
    background: none;
    font-size: 18px;
    cursor: pointer;
  }

  .add-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    background: #4FC3F7;
    border-radius: 50%;
    color: white;
    font-size: 32px;
    text-align: center;
    line-height: 56px;
    cursor: pointer;
  }

  #addModal, #editModal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.4);
    display: none;
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background: white;
    padding: 20px;
    width: 80%;
    border-radius: 8px;
  }

  input, select {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  button {
    width: 100%;
    padding: 12px;
    background: #4FC3F7;
    border: none;
    color: white;
    font-size: 16px;
    border-radius: 6px;
  }
</style>
</head>

<body>
<header>タスク管理</header>

<div class="tabs">
  <div class="tab active" id="mustTab">やるべきこと</div>
  <div class="tab" id="wantTab">やりたいこと</div>
</div>

<!-- フィルタボタン -->
<div class="filters">
  <div class="filter-btn active" data-filter="all">すべて</div>
  <div class="filter-btn" data-filter="incomplete">未完了</div>
  <div class="filter-btn" data-filter="complete">完了</div>
  <div class="filter-btn" data-filter="today">今日</div>
  <div class="filter-btn" data-filter="expired">期限切れ</div>
</div>

<div class="task-list" id="taskList"></div>

<div class="add-btn" id="addBtn">＋</div>

<!-- 追加モーダル -->
<div id="addModal">
  <div class="modal-content">
    <h3>タスクを追加</h3>
    <input id="taskInput" placeholder="タスク名" />
    <input id="timeInput" type="datetime-local" />

    <!-- 🔁 繰り返し選択 -->
    <select id="repeatInput">
      <option value="">繰り返しなし</option>
      <option value="daily">毎日</option>
      <option value="weekly">毎週</option>
      <option value="monthly">毎月</option>
    </select>

    <button id="saveTask">追加</button>
  </div>
</div>

<!-- 編集モーダル -->
<div id="editModal">
  <div class="modal-content">
    <h3>タスクを編集</h3>
    <input id="editTaskInput" />
    <input id="editTimeInput" type="datetime-local" />

    <select id="editRepeatInput">
      <option value="">繰り返しなし</option>
      <option value="daily">毎日</option>
      <option value="weekly">毎週</option>
      <option value="monthly">毎月</option>
    </select>

    <button id="updateTask">更新</button>
  </div>
</div>

<script>
  let currentTab = "must";
  let currentFilter = "all";

  const tasks = JSON.parse(localStorage.getItem("tasks") || '{"must":[],"want":[]}');

  let editingIndex = null;
  let draggingIndex = null;

  function saveData() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }

  function scheduleNotification(title, time) {
    navigator.serviceWorker.getRegistration().then(reg => {
      if (!reg) return;
      const date = new Date(time);
      reg.showNotification("タスク通知", {
        body: title,
        tag: "task-" + Date.now(),
        showTrigger: new TimestampTrigger(date.getTime())
      });
    });
  }

  function applyFilter(list) {
    const todayStr = new Date().toISOString().split("T")[0];

    return list.filter(t => {
      if (currentFilter === "incomplete") return !t.completed;
      if (currentFilter === "complete") return t.completed;
      if (currentFilter === "today") return t.time && t.time.startsWith(todayStr);
      if (currentFilter === "expired") return t.time && !t.completed && new Date(t.time) < new Date();
      return true;
    });
  }

  function render() {
    const taskList = document.getElementById("taskList");
    taskList.innerHTML = "";

    // ソート（未完了 → 完了、未完了は order 順）
    tasks[currentTab].sort((a, b) => {
      if (a.completed !== b.completed) return a.completed - b.completed;
      if (a.completed) return 0;
      return a.order - b.order;
    });

    const filtered = applyFilter(tasks[currentTab]);

    filtered.forEach((t, index) => {
      const div = document.createElement("div");
      div.className = "task";
      if (t.completed) div.classList.add("completed");

      if (!t.completed) {
        div.draggable = true;
        div.ondragstart = () => draggingIndex = index;
        div.ondragover = (e) => e.preventDefault();
        div.ondrop = () => {
          const list = tasks[currentTab];
          const temp = list[draggingIndex].order;
          list[draggingIndex].order = list[index].order;
          list[index].order = temp;
          saveData();
          render();
        };
      }

      const left = document.createElement("div");
      left.style.display = "flex";
      left.style.alignItems = "center";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = t.completed;
      checkbox.onchange = () => toggleComplete(index);

      const repeatIcon =
        t.repeat === "daily" ? " 🔁daily" :
        t.repeat === "weekly" ? " 🔁weekly" :
        t.repeat === "monthly" ? " 🔁monthly" : "";

      const title = document.createElement("span");
      title.textContent =
        " " + t.title +
        (t.time ? " ⏰ " + t.time : "") +
        repeatIcon;

      left.appendChild(checkbox);
      left.appendChild(title);

      const btns = document.createElement("div");
      btns.className = "task-buttons";

      const editBtn = document.createElement("button");
      editBtn.textContent = "✏️";
      editBtn.onclick = () => openEditModal(index);

      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "🗑️";
      deleteBtn.onclick = () => deleteTask(index);

      btns.appendChild(editBtn);
      btns.appendChild(deleteBtn);

      div.appendChild(left);
      div.appendChild(btns);

      taskList.appendChild(div);
    });
  }

  function toggleComplete(index) {
    const task = tasks[currentTab][index];
    task.completed = !task.completed;

    // 🔁 繰り返しタスク（B方式）
    if (task.completed && task.repeat && task.time) {
      const date = new Date(task.time);

      if (task.repeat === "daily") date.setDate(date.getDate() + 1);
      if (task.repeat === "weekly") date.setDate(date.getDate() + 7);
      if (task.repeat === "monthly") date.setMonth(date.getMonth() + 1);

      const nextTime = date.toISOString().slice(0, 16);

      tasks[currentTab].push({
        title: task.title,
        time: nextTime,
        completed: false,
        order: Date.now(),
        repeat: task.repeat
      });

      scheduleNotification(task.title, nextTime);
    }

    saveData();
    render();
  }

  function openEditModal(index) {
    editingIndex = index;
    const task = tasks[currentTab][index];

    document.getElementById("editTaskInput").value = task.title;
    document.getElementById("editTimeInput").value = task.time || "";
    document.getElementById("editRepeatInput").value = task.repeat || "";

    document.getElementById("editModal").style.display = "flex";
  }

  document.getElementById("updateTask").onclick = () => {
    const task = tasks[currentTab][editingIndex];

    task.title = document.getElementById("editTaskInput").value.trim();
    task.time = document.getElementById("editTimeInput").value;
    task.repeat = document.getElementById("editRepeatInput").value;

    saveData();
    render();
    document.getElementById("editModal").style.display = "none";
  };

  function deleteTask(index) {
    tasks[currentTab].splice(index, 1);
    saveData();
    render();
  }

  document.getElementById("mustTab").onclick = () => {
    currentTab = "must";
    mustTab.classList.add("active");
    wantTab.classList.remove("active");
    render();
  };

  document.getElementById("wantTab").onclick = () => {
    currentTab = "want";
    wantTab.classList.add("active");
    mustTab.classList.remove("active");
    render();
  };

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      render();
    };
  });

  document.getElementById("addBtn").onclick = () => {
    document.getElementById("addModal").style.display = "flex";
  };

  document.getElementById("addModal").onclick = (e) => {
    if (e.target === addModal) addModal.style.display = "none";
  };

  document.getElementById("saveTask").onclick = () => {
    const title = taskInput.value.trim();
    const time = timeInput.value;
    const repeat = repeatInput.value;

    if (!title) return;

    tasks[currentTab].push({
      title,
      time,
      completed: false,
      order: Date.now(),
      repeat
    });

    saveData();
    render();

    if (time) scheduleNotification(title, time);

    taskInput.value = "";
    timeInput.value = "";
    repeatInput.value = "";
    addModal.style.display = "none";
  };

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }

  render();
</script>
</body>
</html>
