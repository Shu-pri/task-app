<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>タスク管理</title>
<link rel="manifest" href="manifest.json" />
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: #ffffff;
    color: #333;
  }

  header {
    background: #4FC3F7;
    color: white;
    padding: 16px;
    font-size: 20px;
    text-align: center;
  }

  /* 上部タブ（リスト / カレンダー） */
  .view-tabs {
    display: flex;
    border-bottom: 2px solid #4FC3F7;
  }
  .view-tab {
    flex: 1;
    text-align: center;
    padding: 12px;
    cursor: pointer;
    font-weight: bold;
  }
  .view-tab.active {
    background: #E1F5FE;
    color: #0277BD;
  }

  /* リスト画面のタブ（must / want） */
  .tabs {
    display: flex;
    border-bottom: 2px solid #4FC3F7;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 12px;
    cursor: pointer;
    font-weight: bold;
  }
  .tab.active {
    background: #E1F5FE;
    color: #0277BD;
  }

  /* フィルタボタン */
  .filters {
    display: flex;
    justify-content: space-around;
    padding: 10px;
    border-bottom: 1px solid #ddd;
    background: #f7f7f7;
  }
  .filter-btn {
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    background: #e0e0e0;
    font-size: 14px;
  }
  .filter-btn.active {
    background: #4FC3F7;
    color: white;
  }

  /* タスク一覧 */
  .task-list {
    padding: 16px;
  }
  .task {
    background: #fff;
    border-left: 4px solid #44C3F7;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .task.completed {
    opacity: 0.5;
    text-decoration: line-through;
  }
  .task-buttons button {
    margin-left: 6px;
    border: none;
    background: none;
    font-size: 18px;
    cursor: pointer;
  }
